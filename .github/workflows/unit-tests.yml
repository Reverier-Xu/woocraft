name: unit tests

on:
  pull_request:
  push:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  cargo-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: install linux dependencies
        if: runner.os == 'Linux'
        run: |
          apt_get="apt-get"
          if command -v sudo >/dev/null 2>&1; then
            apt_get="sudo apt-get"
          fi

          $apt_get update
          $apt_get install -y \
            libasound2-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config

      - name: setup rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.95

      - name: cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: run unit tests
        run: cargo test --workspace
