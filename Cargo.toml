[workspace]
members  = ["crates/*"]
resolver = "3"

[workspace.package]
authors      = ["Reverier-Xu <reverier.xu@woooo.tech>"]
description  = "A GPU-accelerated graphical component library built on GPUI."
edition      = "2024"
homepage     = "https://design.woooo.tech/"
license      = "GPL-2.0-only"
publish      = true
readme       = "README.md"
repository   = "https://github.com/Reverier-Xu/woocraft"
rust-version = "1.96"
version      = "0.6.0"

[profile.dev]
codegen-units   = 16
split-debuginfo = "unpacked"

[profile.release]
codegen-units = 1
lto           = "thin"
opt-level     = "z"
strip         = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
# zed's gpui runtime, republished on crates.io as `gpui-pre`; inherited by
# members under the historical `gpui` alias so ported code stays unchanged.
gpui = { version = "0.3", package = "gpui-pre" }
gpui-base = "0.6"
palette = "0.7"
rust-embed = { version = "8.12", features = [
  "interpolate-folder-path",
  "include-exclude",
] }
rust-i18n = "4.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zstd = "0.14"

woocraft = { path = "crates/woocraft" }
