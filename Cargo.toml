[workspace]
members  = ["crates/*"]
resolver = "3"

[workspace.package]
authors      = ["Reverier-Xu <reverier.xu@woooo.tech>"]
edition      = "2024"
homepage     = "https://design.woooo.tech/"
license      = "Apache-2.0"
publish      = true
readme       = "README.md"
repository   = "https://github.com/Reverier-Xu/woocraft"
rust-version = "1.93.0"
version      = "0.2.2"

[profile.release]
codegen-units = 1
lto           = "thin"
opt-level     = 3
panic         = "abort"
strip         = true

[workspace.dependencies]
aho-corasick                  = "1.1"
anyhow                        = "1.0"
chrono                        = "0.4"
enum-iterator                 = "2.1"
gpui                          = "0.2"
gpui-macros                   = "0.2"
lsp-types                     = { version = "0.97", features = ["proposed"] }
palette                       = "0.7"
regex                         = "1.12"
num-traits                    = "0.2"
schemars                      = "1.2"
serde                         = { version = "1.0", features = ["derive"] }
serde_json                    = "1.0"
serde_repr                    = "0.1.19"
smallvec                      = "1.15"
smol                          = "2.0.2"
sum-tree                      = { version = "0.2.0", package = "zed-sum-tree" }
thiserror                     = "2.0"
toml                          = "1.0"
tracing                       = "0.1"
tree-sitter                   = "0.26"
tree-sitter-astro-next        = "0.1.1"
tree-sitter-bash              = "0.25"
tree-sitter-c                 = "0.24"
tree-sitter-c-sharp           = "0.23"
tree-sitter-cmake             = "0.7"
tree-sitter-cpp               = "0.23"
tree-sitter-css               = "0.25"
tree-sitter-diff              = "0.1"
tree-sitter-elixir            = "0.3"
tree-sitter-embedded-template = "0.25"
tree-sitter-go                = "0.25"
tree-sitter-graphql           = "0.1"
tree-sitter-html              = "0.23"
tree-sitter-java              = "0.23"
tree-sitter-javascript        = "0.25"
tree-sitter-jsdoc             = "0.25"
tree-sitter-json              = "0.24"
tree-sitter-kotlin-sg         = "0.4"
tree-sitter-lua               = "0.4"
tree-sitter-make              = "1.1"
tree-sitter-md                = "0.5"
tree-sitter-php               = "0.24"
tree-sitter-proto             = "0.4"
tree-sitter-python            = "0.25"
tree-sitter-ruby              = "0.23"
tree-sitter-rust              = "0.24"
tree-sitter-scala             = "0.24"
tree-sitter-sequel            = "0.3"
tree-sitter-svelte-next       = "0.1"
tree-sitter-swift             = "0.7"
tree-sitter-toml-ng           = "0.7"
tree-sitter-typescript        = "0.23"
tree-sitter-yaml              = "0.7"
tree-sitter-zig               = "1.1"
unicode-segmentation          = "1.12"

rust-embed = { version = "8.11", features = ["interpolate-folder-path"] }
rust-i18n  = "3.1"

ropey = { version = "2.0.0-beta.1", features = [
  "metric_lines_lf",
  "metric_utf16",
] }
