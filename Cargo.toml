[workspace]
members  = ["crates/*"]
resolver = "3"

[workspace.package]
authors      = ["Reverier-Xu <reverier.xu@woooo.tech>"]
description  = "A GPU-accelerated graphical component library built on GPUI."
edition      = "2024"
homepage     = "https://design.woooo.tech/"
license      = "GPL-2.0-only"
publish      = true
readme       = "README.md"
repository   = "https://github.com/Reverier-Xu/woocraft"
rust-version = "1.96"
version      = "0.6.0"

[profile.dev]
codegen-units   = 16
split-debuginfo = "unpacked"

[profile.release]
codegen-units = 1
lto           = "thin"
opt-level     = "z"
strip         = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
gpui = "0.2"

woocraft = { path = "crates/woocraft" }
